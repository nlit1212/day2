<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카운터</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin-top: 80px; }
    #count { font-size: 64px; margin-bottom: 20px; }
    button { font-size: 20px; padding: 10px 24px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="count">0</div>
  <button id="btn">증가</button>
  <script>
    let count = 0;
    const el = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      count += 2;
      el.textContent = count;
    });
  </script>
</body>
</html>
