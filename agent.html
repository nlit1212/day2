<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 특산물 에이전트</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #fff8f0; height: 100vh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
    header { background: #e4572e; color: #fff; padding: 14px; text-align: center; font-weight: bold; }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .me { align-self: flex-end; background: #ffd9a8; border-bottom-right-radius: 4px; }
    .agent { align-self: flex-start; background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
    form { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 20px; min-width: 0; }
    button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 20px; background: #e4572e; color: #fff; cursor: pointer; }
    .note { text-align: center; font-size: 11px; color: #999; padding: 4px 0 8px; background: #fff; }
  </style>
</head>
<body>
  <header>🍊 제주 특산물 에이전트</header>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
    <button type="submit">보내기</button>
  </form>
  <div class="note">※ 지금 답변은 가짜(데모) 답변입니다.</div>

  <script>
    const REPLIES = [
      '안녕하세요, 정은교 님! 🍊 제주도 특산물 안내 에이전트예요. 감귤, 흑돼지, 갈치 중 어떤 게 궁금하세요?',
      '🍊 겨울에 제주에 가신다면 감귤 따기 체험을 추천드려요. 직접 딴 귤을 바로 맛볼 수 있어요!',
      '아직 공부 중이에요! 5일차에 진짜로 알아볼게요.'
    ];
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    let n = 0;

    function add(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, 'me');
      input.value = '';
      const reply = REPLIES[n++ % REPLIES.length];
      setTimeout(() => add(reply, 'agent'), 1000);
    });
  </script>
</body>
</html>
